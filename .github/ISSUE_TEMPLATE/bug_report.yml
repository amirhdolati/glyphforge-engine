name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command, relevant options, and a small reproduction.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, terminal app, terminal dimensions, color mode, and commit/version.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Logs or screenshots
      description: Remove credentials and personal information before attaching output.
